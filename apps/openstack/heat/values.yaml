---
images:
  tags:
    bootstrap: "quay.io/airshipit/openstack-client:2026.1-ubuntu_noble"
    db_init: "quay.io/airshipit/openstack-client:2026.1-ubuntu_noble"
    db_drop: "quay.io/airshipit/openstack-client:2026.1-ubuntu_noble"
    ks_user: "quay.io/airshipit/openstack-client:2026.1-ubuntu_noble"
    ks_service: "quay.io/airshipit/openstack-client:2026.1-ubuntu_noble"
    ks_endpoints: "quay.io/airshipit/openstack-client:2026.1-ubuntu_noble"
    heat_db_sync: "quay.io/airshipit/heat:2026.1-ubuntu_noble"
    heat_api: "quay.io/airshipit/heat:2026.1-ubuntu_noble"
    heat_cfn: "quay.io/airshipit/heat:2026.1-ubuntu_noble"
    heat_engine: "quay.io/airshipit/heat:2026.1-ubuntu_noble"
    heat_engine_cleaner: "quay.io/airshipit/heat:2026.1-ubuntu_noble"
    heat_purge_deleted: "quay.io/airshipit/heat:2026.1-ubuntu_noble"
endpoints:
  identity:
    host_fqdn_override:
      default: keystone.openstack.example.com
      internal: keystone-api.openstack.svc.cluster.local
    scheme:
      default: https
      internal: http
    port:
      api:
        default: 5000
        public: 443
  image:
    host_fqdn_override:
      default: glance.openstack.example.com
      internal: glance-api.openstack.svc.cluster.local
    scheme:
      default: https
      internal: http
    port:
      api:
        default: 9292
        public: 443

  compute:
    host_fqdn_override:
      default: nova-api.openstack.svc.cluster.local
      public: nova.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 8774
        public: 443

  compute_metadata:
    host_fqdn_override:
      default: nova-metadata.openstack.svc.cluster.local
      public: nova-metadata.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 8775
        public: 443

  network:
    host_fqdn_override:
      default: neutron-server.openstack.svc.cluster.local
      public: neutron.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 9696
        public: 443

  volume:
    host_fqdn_override:
      default: cinder-api.openstack.svc.cluster.local
      public: cinder.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 8776
        public: 443

  placement:
    host_fqdn_override:
      default: placement-api.openstack.svc.cluster.local
      public: placement.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 8778
        public: 443

  orchestration:
    host_fqdn_override:
      default: heat-api.openstack.svc.cluster.local
      public: heat.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 8004
        public: 443

  cloudformation:
    host_fqdn_override:
      default: heat-cfn.openstack.svc.cluster.local
      public: heat-cfn.openstack.example.com
    scheme:
      default: http
      public: https
    port:
      api:
        default: 8000
        public: 443

# --- Objets supplémentaires, rendus par la chart avec le reste du service ---
# Alias de Service « heat » : l'API sur le port 80.
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: heat
      namespace: openstack
    spec:
      ports:
      - name: h-api
        port: 80
        protocol: TCP
        targetPort: 8004
      selector:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: heat
        app.kubernetes.io/name: heat
        application: heat
        component: api
        release_group: heat
      sessionAffinity: None
      type: ClusterIP
