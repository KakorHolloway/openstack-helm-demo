# Pool d'IP 192.168.1.200-250 + annonce L2 (après le chart metallb : wave -3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  source:
    repoURL: https://github.com/KakorHolloway/openstack-helm-demo.git
    targetRevision: main
    path: apps/platform/metallb-config
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
