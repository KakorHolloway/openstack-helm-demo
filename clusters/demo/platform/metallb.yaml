apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: "0.16.1"
      helm:
        releaseName: metallb
        valueFiles:
          - $values/apps/platform/metallb/values.yaml
    - repoURL: https://github.com/KakorHolloway/openstack-helm-demo.git
      targetRevision: main
      ref: values
  syncPolicy:
    # Synchro manuelle au départ (adoption des releases existantes).
    # Passer en "automated" une fois le diff ArgoCD vide.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
